schema_version: "1.0"
context_scope: "feature_standalone"
resolved_stack: "typescript-javascript"
product_id: null
product_context_ref: null
selections:
  - id: "code-rule.intent-revealing-names"
    checked: true
    decision: "Names say the role; the naming rules are the custom rules N1-N5 (I7.3)."
  - id: "code-rule.short-functions"
    checked: true
  - id: "code-rule.avoid-deep-nesting"
    checked: true
    decision: "Two levels of conditions and loops, checked in review; ESLint max-depth set to 3, because ESLint also counts a try block and I3 puts one at each client edge (I7.1)."
    enforcement: ["review", "analyzer"]
  - id: "code-rule.dependency-injection"
    checked: true
    decision: "Seams are TS types taken in the constructor, hand-wired in the Host's wiring files (CD3, CD5, I6 B4); no DI container."
  - id: "code-rule.dtos-between-services"
    checked: false
    decision: "Exception 1 (I1, row 8): overridden by the CD4 rule (custom rule project.cd4-callee-declares-dtos): the component that declares a schema exports its DTOs."
  - id: "code-rule.avoid-common-utility-libs"
    checked: true
    decision: "utilities/ holds only its named folders (security, logging, pub-sub, config, clock, link-transport, query-layer); no common/, helpers/ or utils/."
  - id: "code-rule.immutability-intent"
    checked: true
    decision: "const, readonly and as const by default."
  - id: "code-rule.comments-wisely"
    checked: true
    decision: "Names tell the story; TSDoc on every entry file's exports."
  - id: "code-rule.no-magic-numbers"
    checked: true
    decision: "Named constants, checked in review only: the lint rule flags HTTP status codes, 0 and 1, and test data (I7.1)."
    enforcement: ["review"]
  - id: "code-rule.optimize-apis-for-call-site"
    checked: true
  - id: "code-rule.stronger-domain-types"
    checked: true
    decision: "String unions and per-component string-named brands applied at edge parsers, not enums (I2.3, CD4 Q2)."
  - id: "code-rule.object-invariants"
    checked: true
    decision: "Guard at construction; parse untrusted input at the edges with zod."
  - id: "code-rule.no-leaky-mutable-internals"
    checked: true
    decision: "Hand out readonly views, never internal arrays or maps."
  - id: "code-rule.normalize-state"
    checked: true
  - id: "code-rule.simple-trustworthy-tests"
    checked: true
    decision: "As decided at I4 (see code-rule.testing-posture)."
  - id: "code-rule.docs-as-api-test"
    checked: true
    decision: "A tool that is hard to describe in its MCP description gets reshaped."
  - id: "code-rule.language-native-constructs"
    checked: true
    decision: "Components are classes (CD3, CD5); logic helpers are module functions; DTOs are plain readonly data, not classes; private state in JavaScript #private fields (N5)."
  - id: "code-rule.secure-coding-defaults"
    checked: true
    decision: "As decided at security-compliance (SC1-SC7)."
  - id: "code-rule.solid-baseline"
    checked: true
    decision: "SRP, OCP, LSP, ISP and DIP in TypeScript's idiom."
  - id: "code-rule.complex-code-stable"
    checked: true
    decision: "IDesign engines hold the rules and do no I/O (CD2)."
  - id: "code-rule.anti-corruption-layers"
    checked: true
    decision: "Ring payloads are mapped in Normalize, a tolerant reader; each component owns its DTOs (CD4)."
  - id: "code-rule.polymorphism-mechanism"
    checked: true
    decision: "A TS type taken in the constructor; an interface only where there is more than one implementation; no base classes (CD3, CD5)."
  - id: "code-rule.extension-points"
    checked: true
    decision: "Composition at start, policy as data, Pub/Sub for queued manager calls; no inheritance trees and no plugins (CD5)."
  - id: "code-rule.careful-retries"
    checked: true
    decision: "Reconnect backoff 1-30 s with jitter; outbox resend after 10 s; Ring circuit after 5 failures; commands are never retried automatically (OR5, D4)."
  - id: "code-rule.logging-traceability"
    checked: true
    decision: "Structured JSON lines to stdout, IDs not content; event_id, request_id, command_id, client_id and the connector session id end to end (OR1, OR2); our own allow-list logger (I6 B3)."
  - id: "code-rule.robustness-state-boundaries"
    checked: true
    decision: "The outbox; events at least once, commands at most once; the single-instance lease; the Ring circuit (D4, OR4, OR5, B7)."
  - id: "code-rule.api-service-design"
    checked: true
    decision: "The D7 tools, reply and error envelopes and error codes; additive changes only (D2)."
  - id: "code-rule.public-api-reusable-design"
    checked: true
    decision: "The Public Contract module, published as JSON Schema under schemas/; CI fails if stale (CD4 Q1, I5.2)."
  - id: "code-rule.authz-security-context"
    checked: true
    decision: "Scopes read, media, control; client-bound one-time tokens; the disarm gate with MRTR and URL elicitation; a fresh sign-in (D4, SC3)."
  - id: "code-rule.write-conflict-semantics"
    checked: true
    decision: "Commands at most once with a command_id, under the single-instance lease (D4, B7)."
  - id: "code-rule.collection-query-semantics"
    checked: true
    decision: "Cursors by seq, never skipping; the cursor epoch (D7, DS5)."
  - id: "code-rule.pagination-delivery"
    checked: true
    decision: "Pages bounded as in D8; cursor-based delivery."
  - id: "code-rule.protocol-choice"
    checked: true
    decision: "MCP over HTTPS toward agents; the WSS link dialed out from home; platform webhooks (D1)."
  - id: "code-rule.messaging-event-processing"
    checked: true
    decision: "Pub/Sub for queued manager calls; the outbox; dedupe on event_id (CD2, D4)."
  - id: "code-rule.cache-boundaries"
    checked: true
    decision: "The Media Cache (7 days) and Capture's max_age_s; no cache used to communicate (D4)."
  - id: "code-rule.validation-boundaries"
    checked: true
    decision: "Validation at the edge parsers with zod, which apply the brands (CD4 Q2)."
  - id: "code-rule.ts.strictness-posture"
    checked: true
    decision: "I2 and I1 rows 2-6: TypeScript 6.0.3 alone, pinned exactly, with 7-ready settings; 7.1 replaces it once typescript-eslint declares support (TS 7.0 ships no compiler API). strict plus noUncheckedIndexedAccess, exactOptionalPropertyTypes, noImplicitOverride, noImplicitReturns, noFallthroughCasesInSwitch, verbatimModuleSyntax, erasableSyntaxOnly and rewriteRelativeImportExtensions. Erasable syntax only (no enums, parameter properties, runtime namespaces or decorators): Node runs the .ts while coding and tsc builds JS for the images. ES modules only, module and moduleResolution nodenext. ESLint 10 flat config with typescript-eslint strictTypeChecked plus stylisticTypeChecked, versions locked, typed linting everywhere; key rules no-floating-promises, no-misused-promises, switch-exhaustiveness-check, no-explicit-any, consistent-type-imports. Prettier defaults with eslint-config-prettier. All at pre-commit and in CI."
    enforcement: ["compiler", "analyzer", "formatter", "review"]
  - id: "code-rule.lts-version-check"
    checked: true
    decision: "I2.1 and I1 row 7: Node 26 LTS on every part (core image, connector image, mode A); fallback Node 24.11 or later (Babel 8 through Stryker needs 24.11); devEngines.runtime at the root, node ^24.11 || ^26, onFail error; re-check the LTS at each feature. Tracked spike: oidc-provider and ring-client-api 14.3.0 on Node 26."
  - id: "code-rule.type-inference-deliberate"
    checked: true
    decision: "Explicit types on exported functions and at component boundaries; inference inside function bodies; unknown at the edges, then parsed by zod; never any (I2.4)."
  - id: "code-rule.idiomatic-error-handling"
    checked: true
    decision: "I3: exceptions for the unexpected and for errors meant for the original caller; a known case the caller handles on the spot is a normal return value. One error class per component with a closed kind union, declared next to its DTOs; control errors require outcome in the constructor; a manager passes on only its own declared errors with the original as cause; each client maps by kind (MCP Endpoint to D7, the Issuer to OAuth error replies, Web to page states, the links to result messages, Scheduler to the log and Health); any other exception becomes INTERNAL. The caller sees bridge-written messages only; each error is logged once, by the handling client; AbortSignal passed down each async call; only a failure outside every handler exits the process."
  - id: "code-rule.testing-posture"
    checked: true
    decision: "I4: a stand-in in CI for every real device or service (the scenario engine, the fake Entra as a second oidc-provider, SQL Server and SQLite, Azurite, the in-memory and localhost WSS link, fixed test images and real ffmpeg on short clips, the MCP SDK client, Playwright at 3 widths in both themes); recorded Ring payloads committed only after the scrub and the human's review; Vitest 5; CI gate 90% lines and 85% branches with the listed exclusions; a completeness check; weekly StrykerJS on engines and Normalize; test-first for engines, edge parsers, Normalize and every bug fix; every PR, main and weekly layers; the pilot run by the human only, with disarm off."
  - id: "code-rule.shared-code-packaging"
    checked: true
    decision: "I5 (b): one npm workspace with bridge/ (core and connector, one package, two modes) and shim/ (MCP SDK only); one wiring file per run mode, loaded by a dynamic import of a literal path; seam implementations in their own files, imported only by the Host's wiring; relative imports with the .ts extension, no path aliases; unit tests beside the code; dependency-cruiser enforces the I5.3 reachability rules."
  - id: "code-rule.copy-semantics"
    checked: true
    decision: "L1: DTOs are readonly data; each component maps to its own DTOs at its boundary (CD4); structuredClone only for an explicit snapshot."
  - id: "code-rule.concurrency-over-locks"
    checked: true
    decision: "L2: one event loop, no locks; no check-then-act across an await on shared state; a queue per key where order matters."
  - id: "code-rule.strategy-state-over-repeated-conditionals"
    checked: true
    decision: "L3: a handler map by kind or a state object instead of the same switch in several places; one exhaustive switch is fine."
  - id: "code-rule.declarative-collections"
    checked: true
    decision: "L4: array methods when clearer; for...of for awaits in sequence and early exits; no lodash."
  - id: "code-rule.evidence-driven-performance"
    checked: true
    decision: "L5: no tuning without a measurement; the bridge-internal 0.5 s p95 CI test is the budget; node --cpu-prof finds the cause."
  - id: "code-rule.never-block-event-loop"
    checked: true
    decision: "ffmpeg as a child process; the async crypto.argon2, never argon2Sync; no sync file calls after start. One recorded exception, SQLite posture (a): node:sqlite calls are synchronous and accepted, kept short (indexed statements on a local file, batches bounded by the D8 pages); the 0.5 s p95 CI test also runs in mode A, and if it fails SQLite moves to a worker thread."
  - id: "code-rule.render-purity"
    checked: true
    decision: "Server-rendered pages; templates are pure functions of their data (B7 tagged templates that escape by default)."
  - id: "code-rule.rendering-hosting-model"
    checked: true
    decision: "Plain server-rendered HTML served by the core with the bridge's own CSS tokens; no front-end framework (ui-ux U1)."
  - id: "code-rule.ui-controls-prevent-invalid-input"
    checked: true
    decision: "The PIN field takes digits only; the server checks again."
  - id: "code-rule.framework-validation"
    checked: true
    decision: "zod at the edges; the published JSON Schema comes from zod (z.toJSONSchema)."
  - id: "code-rule.vendor-neutral-observability"
    checked: true
    decision: "Carried from OR1: JSON lines on stdout to Log Analytics, no vendor SDK in the code; no OpenTelemetry in v1."
  - id: "code-rule.technology-enabler-shortlist"
    checked: true
    decision: "None: no Dapr, Temporal or similar; settled by the topology."
  - id: "code-rule.cncf-maturity"
    checked: false
    decision: "Not applicable: the core runs on App Service, not Kubernetes."
custom_rules:
  - id: "project.cd4-callee-declares-dtos"
    text: "Replaces code-rule.dtos-between-services (I1 row 8). Each component exports its own DTOs and its error class from its one entry file index.ts; the callee declares, with no shared types file; over the link the receiver declares; only MCP Endpoint and Delivery import the Public Contract; checked by dependency-cruiser in CI (CD4)."
    scope: "cross-language"
    provenance: "free-text"
  - id: "project.n1-kebab-case-files"
    text: "N1: files and folders in kebab-case; each component's entry file is index.ts."
    scope: "language:typescript-javascript"
    provenance: "free-text"
  - id: "project.n2-named-exports-only"
    text: "N2: named exports only (ESLint no-restricted-exports with restrictDefaultExports); the tool config files at the root are exempt."
    scope: "language:typescript-javascript"
    provenance: "free-text"
  - id: "project.n3-naming-convention"
    text: "N3: PascalCase for types and classes, camelCase for values and functions, UPPER_SNAKE for module constants (typescript-eslint naming-convention, without its types option)."
    scope: "language:typescript-javascript"
    provenance: "free-text"
  - id: "project.n4-no-i-prefix"
    text: "N4: no I prefix on interfaces: the seam is the role (QueryLayer) and the implementation adds its technology (SqliteQueryLayer); IDesign role words stay (InquiryManager, SafetyEngine, RingAccess)."
    scope: "language:typescript-javascript"
    provenance: "free-text"
  - id: "project.n5-private-fields"
    text: "N5: a class keeps its private state in JavaScript #private fields, not TypeScript private."
    scope: "language:typescript-javascript"
    provenance: "free-text"
  - id: "project.built-in-first"
    text: "I6 group B choices that add no dependency: B3 our own JSON-lines logger with an allow-list of fields; B4 hand-wired DI; B5 node:sqlite (Database when present, else DatabaseSync); B6 hand-written SQL per dialect behind the Query layer seam, with numbered forward-only migration files applied by the Host under the lease; B7 tagged templates that escape by default; B8 crypto.argon2; B10 git core.hooksPath to a committed .githooks folder, set by npm prepare; B11 npm sbom with a license allow-list; B12 GitHub Actions service containers, with compose locally."
    scope: "cross-language"
    provenance: "free-text"
  - id: "project.supply-chain-policy"
    text: "I6 group C: exact versions (save-exact), one lockfile, npm ci everywhere; install scripts off in the CI and image install commands only (npm ci --ignore-scripts), not in the committed .npmrc; no engine-strict; devEngines.runtime at the root (node ^24.11 || ^26, onFail error); npm overrides pin werift's five wildcard parts; npm audit fails on high or critical over the whole tree, with a written exception list (first entry: ip via werift 0.22.4, GHSA-2p57-rm9w-gvfp, until ring-client-api ships werift 0.25); the license allow-list (runtime MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, BlueOak-1.0.0, Unlicense; dev only also MPL-2.0 and CC-BY-4.0; the two no-license runtime packages reviewed at plan; ffmpeg recorded separately); ffmpeg from the Linux distribution, never ffmpeg-for-homebridge's download; Dependabot alerts and weekly grouped updates; a dependency record here (Specrew FR-013) before any new dependency merges; gitleaks as a pinned binary checked by checksum in the pre-commit hook and CI. Needs for implement: the audit-exception script over npm audit --json and the license check over npm sbom."
    scope: "cross-language"
    provenance: "free-text"
dependency_policy:
  stance: "approved-new-dependencies"
  selected:
    - name: "ring-client-api"
      version: "14.3.0"
      license: "MIT"
      source_org: "dgreif (community)"
      canonical_url: "https://github.com/dgreif/ring"
      maintenance_signal: "last release 2026-02-08; commits to 2026-10-25"
      security_advisory_status: "0 own; ip via werift (finding 2)"
      compatibility: "declares Node 20, 22 and 24; Node 26 checked by the tracked spike (finding 1)"
      cost_or_quota: "$0"
      coupling_weight: "heavy: the whole unofficial Ring protocol, only inside Ring Adapter and Live Media"
      replaceability: "replaceable behind Ring Access, later by the official API"
      test_implications: "never in CI (SC4); the simulated home stands in; the pilot tests it"
